services:
  app1:
    build: ./app
    ports:
      - "5001:5000"
    volumes:
      - mensagens_data:/data
    networks:
      - rede_mensagens
    environment:
      - APP_NAME=app1
      - PEERS=app2,app3

  app2:
    build: ./app
    ports:
      - "5002:5000"
    volumes:
      - mensagens_data:/data
    networks:
      - rede_mensagens
    environment:
      - APP_NAME=app2
      - PEERS=app1,app3

  app3:
    build: ./app
    ports:
      - "5003:5000"
    volumes:
      - mensagens_data:/data
    networks:
      - rede_mensagens
    environment:
      - APP_NAME=app3
      - PEERS=app1,app2

networks:
  rede_mensagens:
    driver: bridge

volumes:
  mensagens_data:
